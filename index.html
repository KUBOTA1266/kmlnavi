<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4aa2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KMLナビ">
<title>KMLナビ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--sign:#0b4aa2;--sign-d:#083a80;--danger:#c4161c;--ink:#111318;--sub:#4b5260;--line:#d9dde3;--bg:#ffffff;--soft:#f2f4f7;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:#e9ecef;-webkit-text-size-adjust:100%}
#map{position:absolute;inset:0;background:#e9ecef;z-index:0}
button,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:17px;font-weight:600;padding:0 16px}
.btn.primary{background:var(--sign);border-color:var(--sign);color:#fff}
.btn.link{border:none;background:none;color:var(--sign);min-height:44px;font-size:15px}
.btn:focus-visible,.chip:focus-visible,.fab:focus-visible,select:focus-visible{outline:3px solid #ffb400;outline-offset:2px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:var(--bg);border-radius:18px 18px 0 0;padding:20px 18px calc(16px + var(--safe-b));box-shadow:0 -6px 24px rgba(0,0,0,.18);max-height:88dvh;overflow:auto}
.sheet h1{font-size:28px;line-height:1.1;margin:0 0 6px;letter-spacing:.02em}
.sheet h2{font-size:21px;line-height:1.25;margin:0 0 4px}
.lead{margin:0 0 16px;color:var(--sub);font-size:15px;line-height:1.55}
.stack{display:grid;gap:10px}
.notes{margin:14px 0 0;padding:12px 14px;background:var(--soft);border-radius:12px;font-size:13.5px;line-height:1.6;color:var(--sub)}
.notes p{margin:0 0 6px}.notes p:last-child{margin:0}
.warnline{color:#8a1d12;font-weight:600}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
select{width:100%;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:16px;padding:0 10px}
.nav{position:absolute;left:0;right:0;top:0;z-index:1000;background:var(--sign);color:#fff;padding:calc(10px + var(--safe-t)) 14px 12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.nav.off{background:var(--danger);animation:blink 1.2s steps(2) infinite}
.nav.wait{background:#2b2f36}
@keyframes blink{50%{background:#8f0d12}}
@media (prefers-reduced-motion:reduce){.nav.off{animation:none}}
.navrow{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center}
#arrow{width:76px;height:76px;display:flex;align-items:center;justify-content:center}
#dist{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
#dirText{font-size:22px;font-weight:700;line-height:1.25;margin-top:4px}
#sub{font-size:15px;line-height:1.4;margin-top:8px;opacity:.95}
#resync{margin-top:10px;min-height:46px;border-radius:10px;border:2px solid #fff;background:transparent;color:#fff;font-weight:700;width:100%}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:var(--bg);padding:10px 12px calc(10px + var(--safe-b));box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.stats{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:12px;color:var(--sub)}
.barbtns{display:flex;gap:8px;margin-left:auto}
.chip{min-height:46px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.end{border-color:var(--danger);color:var(--danger)}
#demoCtl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);align-items:center}
#demoCtl .lbl{font-size:13px;color:var(--sub);margin-right:2px}
#demoCtl[hidden],#resync[hidden]{display:none}
#said{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.4;min-height:18px}
#wakeNote{font-size:12.5px;color:#8a1d12;margin-top:6px}
.fab{position:absolute;right:12px;z-index:1001;min-height:46px;padding:0 14px;border-radius:23px;border:none;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.25);font-weight:700;font-size:15px}
#layerBtn{top:calc(12px + var(--safe-t))}
body.navon #layerBtn{display:none}
#recenter{bottom:calc(var(--barh,150px) + 12px);background:var(--sign);color:#fff}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(50% );z-index:1100;background:rgba(17,19,24,.92);color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;max-width:88vw;text-align:center;line-height:1.5}
#maperr{position:absolute;left:12px;right:12px;top:calc(70px + var(--safe-t));z-index:1001;background:#fff4d6;color:#5b3d00;border-radius:10px;padding:10px 12px;font-size:14px}
.me{background:none;border:none}
.leaflet-control-attribution{font-size:10px}
body.navon .leaflet-bottom{bottom:var(--barh,130px)}
body.navon .leaflet-top{top:var(--navh,140px)}
.leaflet-top.leaflet-left{top:calc(4px + var(--safe-t))}
body.navon .leaflet-top.leaflet-left{top:var(--navh,140px)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="map" role="application" aria-label="地図"></div>
<div id="maperr" hidden>地図を読み込めませんでした。電波を確認してください（案内は線だけでも動きます）。</div>

<header id="nav" class="nav" hidden aria-live="polite">
  <div class="navrow">
    <div id="arrow"></div>
    <div>
      <div id="dist"></div>
      <div id="dirText"></div>
    </div>
  </div>
  <div id="sub"></div>
  <button id="resync" hidden>現在地からルートを探し直す</button>
</header>

<section id="start" class="sheet">
  <h1>KMLナビ</h1>
  <p class="lead">KMLの線どおりにだけ案内するナビです。勝手にルートを引き直しません。</p>
  <div class="stack">
    <button id="openBtn" class="btn primary">KMLファイルを開く</button>
    <button id="lastBtn" class="btn" hidden>前回のルート：<span id="lastName"></span></button>
  </div>
  <div class="notes">
    <p>ルートメーカーなどで書き出した、線の入ったKMLを使います。</p>
    <p>案内中は画面が消えないようにします。充電しながら使ってください。</p>
    <p class="warnline">試作版です。通る道は、許可証と現地の標識で必ず確認してください。運転中は操作しないでください。</p>
  </div>
</section>

<section id="routeSheet" class="sheet" hidden>
  <h2 id="rName"></h2>
  <p class="lead" id="rMeta"></p>
  <label class="f" for="from">どこから案内しますか</label>
  <select id="from"></select>
  <div class="stack" style="margin-top:14px">
    <button id="gpsBtn" class="btn primary">GPSで案内を始める</button>
    <button id="demoBtn" class="btn">デモ走行で試す</button>
    <button id="openBtn2" class="btn link">別のKMLを開く</button>
  </div>
</section>

<section id="bar" class="bar" hidden>
  <div class="stats">
    <div class="stat"><span>残り</span><b id="remain">–</b></div>
    <div class="stat"><span>速度</span><b id="speed">–</b></div>
    <div class="barbtns">
      <button id="muteBtn" class="chip" aria-pressed="false">音声オン</button>
      <button id="endBtn" class="chip end">終了</button>
    </div>
  </div>
  <div id="said" aria-live="polite"></div>
  <div id="wakeNote" hidden>この端末では画面の自動オフを止められません。設定で自動ロックをオフにしてください。</div>
  <div id="demoCtl" hidden>
    <span class="lbl">デモ速度</span>
    <button id="x1" class="chip">×1</button>
    <button id="x3" class="chip">×3</button>
    <button id="x10" class="chip">×10</button>
    <button id="skip" class="chip">次の曲がり角へ</button>
    <button id="detour" class="chip">わざと外れる</button>
  </div>
</section>

<button id="layerBtn" class="fab">地図切替</button>
<button id="recenter" class="fab" hidden>現在地に戻る</button>
<div id="toast" hidden role="status"></div>
<input id="file" type="file" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function (root) {
  'use strict';
  var RAD = Math.PI / 180;

  function hav(a, b) {
    var la1 = a.lat * RAD, la2 = b.lat * RAD;
    var dla = la2 - la1, dlo = (b.lon - a.lon) * RAD;
    var h = Math.sin(dla / 2) * Math.sin(dla / 2) + Math.cos(la1) * Math.cos(la2) * Math.sin(dlo / 2) * Math.sin(dlo / 2);
    return 2 * 6371000 * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function bearing(a, b) {
    var la1 = a.lat * RAD, la2 = b.lat * RAD, dl = (b.lon - a.lon) * RAD;
    var y = Math.sin(dl) * Math.cos(la2);
    var x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dl);
    return (Math.atan2(y, x) / RAD + 360) % 360;
  }
  function angDiff(a, b) { return ((b - a + 540) % 360) - 180; }

  function textOf(el, tag) {
    if (!el) return '';
    for (var i = 0; i < el.childNodes.length; i++) {
      var c = el.childNodes[i];
      if (c.nodeType === 1 && (c.localName || c.nodeName) === tag) return (c.textContent || '').trim();
    }
    return '';
  }
  function byTag(el, tag) { return el.getElementsByTagNameNS ? el.getElementsByTagNameNS('*', tag) : el.getElementsByTagName(tag); }
  function parseCoords(s) {
    var out = [];
    var parts = (s || '').trim().split(/\s+/);
    for (var i = 0; i < parts.length; i++) {
      var a = parts[i].split(',');
      if (a.length < 2) continue;
      var lon = parseFloat(a[0]), lat = parseFloat(a[1]);
      if (isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) out.push({ lat: lat, lon: lon });
    }
    return out;
  }

  function parseKML(text, DP) {
    var Parser = DP || root.DOMParser;
    var doc = new Parser().parseFromString(text, 'application/xml');
    if (byTag(doc, 'parsererror').length) throw new Error('KMLファイルを読み込めませんでした');
    var docs = byTag(doc, 'Document');
    var name = docs.length ? textOf(docs[0], 'name') : '';
    var pms = byTag(doc, 'Placemark');
    var segments = [], stops = [];
    for (var i = 0; i < pms.length; i++) {
      var pm = pms[i], pmName = textOf(pm, 'name');
      var lines = byTag(pm, 'LineString');
      for (var j = 0; j < lines.length; j++) {
        var pts = parseCoords(textOf(lines[j], 'coordinates'));
        if (pts.length >= 2) segments.push({ name: pmName, pts: pts });
      }
      if (!lines.length) {
        var p = byTag(pm, 'Point');
        if (p.length) {
          var c = parseCoords(textOf(p[0], 'coordinates'));
          if (c.length) stops.push({ name: pmName, lat: c[0].lat, lon: c[0].lon });
        }
      }
    }
    if (!segments.length) throw new Error('このKMLには線（ルート）が入っていません');
    return { name: name || (segments[0].name || 'ルート'), segments: segments, stops: stops };
  }

  function endName(seg, stops, endPt) {
    var m = (seg.name || '').split(/\s*[〜～~]\s*/);
    if (m.length >= 2 && m[m.length - 1]) return m[m.length - 1];
    var best = null, bd = 400;
    for (var i = 0; i < stops.length; i++) {
      var d = hav(stops[i], endPt);
      if (d < bd) { bd = d; best = stops[i].name; }
    }
    return best || '';
  }

  function buildRoute(parsed) {
    var pts = [], conn = [], segs = [];
    var lat0 = 0, lon0 = 0, n0 = 0;
    parsed.segments.forEach(function (sg) { sg.pts.forEach(function (p) { lat0 += p.lat; lon0 += p.lon; n0++; }); });
    lat0 /= n0; lon0 /= n0;
    var kx = Math.cos(lat0 * RAD) * 111320, ky = 110540;
    function add(p, isConn, segIdx) {
      var last = pts[pts.length - 1];
      if (last && hav(last, p) < 0.5) return;
      var s = last ? last.s + hav(last, p) : 0;
      if (last) conn.push(!!isConn);
      pts.push({ lat: p.lat, lon: p.lon, s: s, x: (p.lon - lon0) * kx, y: (p.lat - lat0) * ky, seg: segIdx });
    }
    parsed.segments.forEach(function (sg, si) {
      var startS = pts.length ? pts[pts.length - 1].s : 0;
      sg.pts.forEach(function (p, k) { add(p, k === 0 && pts.length > 0, si); });
      var e = sg.pts[sg.pts.length - 1];
      segs.push({ name: sg.name, startS: startS, endS: pts[pts.length - 1].s, end: endName(sg, parsed.stops, e) });
    });
    var brg = [];
    for (var i = 0; i < pts.length - 1; i++) brg.push(bearing(pts[i], pts[i + 1]));
    return { name: parsed.name, pts: pts, conn: conn, brg: brg, segs: segs, stops: parsed.stops, total: pts[pts.length - 1].s, lat0: lat0, lon0: lon0, kx: kx, ky: ky };
  }

  function idxAt(r, s) {
    var lo = 0, hi = r.pts.length - 1;
    if (s <= 0) return 0;
    if (s >= r.total) return hi - 1;
    while (hi - lo > 1) { var m = (lo + hi) >> 1; if (r.pts[m].s <= s) lo = m; else hi = m; }
    return lo;
  }
  function pointAt(r, s) {
    s = Math.max(0, Math.min(r.total, s));
    var i = idxAt(r, s), a = r.pts[i], b = r.pts[Math.min(i + 1, r.pts.length - 1)];
    var L = b.s - a.s, t = L > 0 ? (s - a.s) / L : 0;
    return { lat: a.lat + (b.lat - a.lat) * t, lon: a.lon + (b.lon - a.lon) * t, x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, i: i, s: s };
  }

  function label(d) {
    var ad = Math.abs(d), side = d > 0 ? '右' : '左';
    if (ad >= 150) return 'Uターン';
    if (ad >= 60) return side;
    return '斜め' + side;
  }

  function detectTurns(r) {
    var cand = [];
    for (var i = 1; i < r.pts.length - 1; i++) {
      var P = r.pts[i], s = P.s, sg = r.segs[P.seg];
      if (s - sg.startS < 60 || sg.endS - s < 120) continue;
      if (r.conn[i - 1] || r.conn[i]) continue;
      var a1 = pointAt(r, s - 25), b1 = pointAt(r, s + 25), a2 = pointAt(r, s - 70), b2 = pointAt(r, s + 70);
      if (hav(a1, P) < 5 || hav(P, b1) < 5) continue;
      var ds = angDiff(bearing(a1, P), bearing(P, b1));
      var dl = angDiff(bearing(a2, P), bearing(P, b2));
      if (Math.abs(ds) < 35) continue;
      if (Math.abs(ds) < 0.6 * Math.abs(dl) && Math.abs(dl) < 150) continue;
      cand.push({ i: i, s: s, d: ds });
    }
    var out = [];
    cand.forEach(function (c) {
      var last = out[out.length - 1];
      if (last && c.s - last.s < 50) { if (Math.abs(c.d) > Math.abs(last.d)) out[out.length - 1] = c; }
      else out.push(c);
    });
    return out.map(function (c) { return { s: c.s, deg: Math.round(c.d), dir: label(c.d), lat: r.pts[c.i].lat, lon: r.pts[c.i].lon, seg: r.pts[c.i].seg }; });
  }

  function project(r, fix) {
    return { x: (fix.lon - r.lon0) * r.kx, y: (fix.lat - r.lat0) * r.ky };
  }
  function search(r, p, s0, s1, heading, preferFirst, sref) {
    var i0 = idxAt(r, Math.max(0, s0)), i1 = Math.min(r.pts.length - 2, idxAt(r, Math.min(r.total, s1)) + 1);
    var best = null, first = null;
    for (var i = i0; i <= i1; i++) {
      var a = r.pts[i], b = r.pts[i + 1];
      if (heading != null && Math.abs(angDiff(heading, r.brg[i])) > 100) continue;
      var dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy;
      var t = L2 > 0 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2 : 0;
      t = Math.max(0, Math.min(1, t));
      var qx = a.x + dx * t, qy = a.y + dy * t;
      var d = Math.sqrt((p.x - qx) * (p.x - qx) + (p.y - qy) * (p.y - qy));
      var res = { d: d, s: a.s + (b.s - a.s) * t, i: i, conn: r.conn[i], lat: a.lat + (b.lat - a.lat) * t, lon: a.lon + (b.lon - a.lon) * t };
      res.score = d + (sref != null ? 0.03 * Math.abs(res.s - sref) : 0);
      if (!best || res.score < best.score) best = res;
      if (preferFirst && !first && d <= 40) first = res;
    }
    return first || best;
  }

  function Matcher(r) { this.r = r; this.s = null; this.off = false; this.bad = 0; this.good = 0; this.last = null; this.offMeters = 0; this.lastT = 0; this.locked = false; }
  Matcher.prototype.reset = function () { this.s = null; this.off = false; this.bad = 0; this.good = 0; this.offMeters = 0; this.lastT = 0; this.locked = false; };
  Matcher.prototype.update = function (fix) {
    var r = this.r, p = project(r, fix);
    var heading = (fix.heading != null && isFinite(fix.heading) && (fix.speed || 0) > 2.5) ? fix.heading : null;
    var res;
    if (this.s == null || !this.locked) res = search(r, p, this.minS || 0, r.total, null, true);
    else {
      var ahead = this.off ? 3000 : Math.max(800, (fix.speed || 15) * 40);
      var back = this.off ? 50 : 150;
      var sref = this.off ? this.s + Math.min(2500, this.offMeters) : this.s;
      res = search(r, p, this.s - back, this.s + ahead, heading, false, sref);
      if (!res) res = search(r, p, this.s - back, this.s + ahead, null, false, sref);
    }
    var acc = fix.acc || 10;
    var tol = Math.max(30, Math.min(80, acc * 1.5));
    if (res && res.conn) tol = Math.max(tol, 150);
    var now = fix.t || (this.lastT ? this.lastT + 1000 : 0);
    var dt = this.lastT ? Math.max(0, Math.min(10, (now - this.lastT) / 1000)) : 1;
    this.lastT = now;
    if (this.off) this.offMeters += Math.max(3, fix.speed || 8) * dt; else this.offMeters = 0;
    var ev = null;
    if (!this.locked) {
      if (res && res.d <= tol) { this.locked = true; this.s = res.s; this.good = 1; ev = 'join'; }
      this.last = { s: this.locked ? this.s : null, d: res ? res.d : Infinity, off: false, ev: ev, near: res, tol: tol, approach: !this.locked };
      return this.last;
    }
    if (res && res.d <= tol) {
      this.good++; this.bad = 0;
      if (this.s == null || !this.off || this.good >= 2) {
        if (this.off) { this.off = false; ev = 'back'; }
        this.s = res.s;
      }
    } else {
      this.bad++; this.good = 0;
      if (!this.off && this.s != null && (this.bad >= 3 || (res && res.d > tol * 2.5))) { this.off = true; ev = 'off'; }
      if (this.s == null && res) this.s = res.s;
    }
    this.last = { s: this.s, d: res ? res.d : Infinity, off: this.off, ev: ev, near: res, tol: tol };
    return this.last;
  };

  function meters(n) { return n >= 1000 ? (n / 1000) + 'キロ' : n + 'メートル'; }

  function Guide(r, turns) {
    this.r = r; this.turns = turns; this.k = 0; this.said = {}; this.seg = 0;
  }
  Guide.prototype.reset = function (s) {
    this.said = {}; this.k = 0;
    while (this.k < this.turns.length && this.turns[this.k].s < s + 20) this.k++;
    this.seg = 0;
    while (this.seg < this.r.segs.length - 1 && this.r.segs[this.seg].endS < s) this.seg++;
  };
  Guide.prototype.update = function (s, speed) {
    var t = this.turns, out = [];
    while (this.k < t.length && t[this.k].s < s - 15) this.k++;
    var cur = t[this.k], nxt = t[this.k + 1];
    var far = (speed || 0) > 16 ? 1000 : 500;
    var info = null;
    if (cur) {
      var D = cur.s - s;
      var chain = (nxt && nxt.s - cur.s < 150) ? nxt.dir : null;

  /* ---------- KML ---------- */

  /* ---------- screens ---------- */

    var sel = $('from');
    sel.innerHTML = '';

  /* ---------- voice & alarm ---------- */

  }

  function onPos(pos) {

      return;
    }

    $('remain').textContent = fmt(gr.remain);
    $('speed').textContent = Math.round(spd * 3.6) + ' km/h';
  }
  function arrowSVG(deg, straight) {

  }
  function setPanel(o) {
    var nav = $('nav');

  /* ---------- demo ---------- */
  function startDemo() {

    tick();
  }
  function tick() {

      var off = 0;

      var perp = (brg + 90) * Math.PI / 180, n1 = (Math.random() - 0.5) * 6, n2 = (Math.random() - 0.5) * 6;

    }
  }
  function setDemoMult(m) {
    if (!S.demo) return; S.demo.mult = m;

  }

  /* ---------- wiring ---------- */
  function bind() {
    $('file').addEventListener('change', onFile);
    $('openBtn').addEventListener('click', function () { $('file').click(); });
    $('openBtn2').addEventListener('click', function () { $('file').click(); });
    $('lastBtn').addEventListener('click', function () { var l = stored(); if (l) openText(l.text, l.name); });
    $('gpsBtn').addEventListener('click', function () { startNav('gps'); });
    $('demoBtn').addEventListener('click', function () { startNav('demo'); });

    });
    $('recenter').addEventListener('click', function () { S.follow = true; show('recenter', false); if (S.lastFix && S.map) S.map.setView([S.lastFix.lat, S.lastFix.lon], Math.max(S.map.getZoom(), 15)); });

    $('resync').addEventListener('click', function () {
      if (!S.matcher) return; var s0 = S.matcher.s || 0;
      S.matcher.reset(); S.matcher.minS = Math.max(0, s0 - 500); toast('現在地からルートを探し直します');
    });

    $('x3').addEventListener('click', function () { setDemoMult(3); });

      if (!nx) { toast('この先に曲がり角はありません'); return; }
      S.demo.s = Math.max(cur, nx.s - 650); S.matcher.s = S.demo.s;
      toast('曲がり角の650m手前へ移動しました');
    });
    $('detour').addEventListener('click', function () { if (S.demo) { S.demo.detour = 400; toast('400mだけルートから外れて走ります'); } });
    if ('speechSynthesis' in window) try { speechSynthesis.onvoiceschanged = function () { S.voiceJa = null; pickVoice(); }; } catch (e) {}
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    document.addEventListener('drop', function (e) {
      e.preventDefault(); var f = e.dataTransfer && e.dataTransfer.files[0];
      if (f) onFile({ target: { files: [f], set value(v) {} } });
    });
  }

  if ('ResizeObserver' in window) {
    var ro = new ResizeObserver(function () {
      document.documentElement.style.setProperty('--barh', $('bar').offsetHeight + 'px');
      document.documentElement.style.setProperty('--navh', $('nav').offsetHeight + 'px');
    });
    ro.observe($('bar')); ro.observe($('nav'));
  }
  bind();
  initMap();
  startScreen();
})();

</script>
</body>
</html>
